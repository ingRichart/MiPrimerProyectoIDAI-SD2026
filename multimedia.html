<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia</title>
</head>
<body>

    <!--
    Imagen: en donde el apartado 'src' es en donde se encuentra la imagen.
    Y el parametro alt es para colocar una descripción que los búscadores de internet
    usan para identificarlos   
    -->
    <figure>
        <img src="archivos/logo1.jpg" alt="Casas de harry Potter" width="500px" height="500px">
        <img src="archivos/logo2.jpg" alt="Casas de harry Potter" width="500px" height="500px">
        <img src="archivos/logo3.webp" alt="Casas de harry Potter" width="500px" height="500px">
        <figcaption>Escudos de las casas de Harry Potter </figcaption>
    </figure>

    <img src="archivos/ejemplo.avif" alt="Mandalorian" width="500px" height="500px">

    <video src="archivos/14Sep2026.mp4" controls autoplay loop poster="img/134021079838414822.jpg" width="500px" height="500px">

    </video>

</body>
</html>
